<style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, #eaf2ff 0%, #f8f9ff 50%, #ffffff 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        .glass-input {
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease-in-out;
        }
        .glass-input:focus-within {
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02), 0 0 0 1px #005da7;
            background: #ffffff;
        }
        .interactive-scale {
            transition: transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .interactive-scale:active {
            transform: scale(0.98);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="flex items-center justify-center p-4 md:p-8 antialiased text-on-surface">
<!-- Main Container -->
<main class="w-full max-w-[440px] flex flex-col gap-8">
<!-- Header / Logo -->
<header class="flex flex-col items-center justify-center gap-2 mt-8">
<div class="w-16 h-16 rounded-24px bg-primary-container flex items-center justify-center shadow-[0_8px_16px_rgba(0,93,167,0.2)]">
<span class="material-symbols-outlined text-4xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">SmartEnergy</h1>
</header>
<!-- Glassmorphic Login Card -->
<div class="glass-card rounded-[32px] p-6 sm:p-8 flex flex-col gap-8 w-full relative z-10">
<!-- Segmented Control -->
<div class="flex p-1 bg-surface-container-low rounded-24px relative">
<div class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-white rounded-full shadow-sm transition-transform duration-300 ease-in-out transform translate-x-full" id="segment-bg"></div>
<button class="flex-1 py-2.5 font-label-md text-label-md text-primary relative z-10 transition-colors duration-200" id="btn-login" onclick="switchTab('login')">تسجيل الدخول</button>
<button class="flex-1 py-2.5 font-label-md text-label-md text-on-surface-variant relative z-10 transition-colors duration-200" id="btn-signup" onclick="switchTab('signup')">حساب جديد</button>
</div>
<!-- Content Area -->
<div class="flex flex-col gap-6">
<!-- Welcome Text -->
<div class="text-center flex flex-col gap-1">
<h2 class="font-headline-md text-headline-md text-on-surface">أهلاً بعودتك</h2>
<p class="font-body-md text-body-md text-on-surface-variant">ادخل لمتابعة التحكم بأجهزتك</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Phone Input Group -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="phone">رقم الهاتف</label>
<div class="glass-input flex items-center bg-surface-container-low rounded-24px h-14 overflow-hidden group">
<!-- Country Code / Flag -->
<div class="flex items-center gap-2 px-4 h-full bg-surface-variant/30 border-l border-outline-variant/30 text-on-surface font-body-md">
<span class="text-xl">🇱🇾</span>
<span class="dir-ltr inline-block" dir="ltr">+218</span>
</div>
<!-- Input Field -->
<input class="flex-1 h-full bg-transparent border-none focus:ring-0 px-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline/50 dir-ltr text-left" dir="ltr" id="phone" placeholder="9X XXX XXXX" type="tel"/>
</div>
</div>
<!-- Action Button -->
<button class="interactive-scale w-full h-14 rounded-24px bg-gradient-to-r from-primary to-secondary text-white font-label-md text-label-md flex items-center justify-center gap-2 shadow-[0_8px_20px_rgba(49,107,243,0.3)] mt-2" type="submit">
<span>إرسال رمز التحقق</span>
<span class="material-symbols-outlined rtl:rotate-180">arrow_forward</span>
</button>
</form>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
<span class="font-description-sm text-description-sm text-outline">أو</span>
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Guest Login -->
<button class="interactive-scale w-full h-12 rounded-full border border-outline-variant text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors flex items-center justify-center">
                متابعة كزائر
            </button>
</div>
<!-- Footer Links -->
<div class="flex justify-center gap-4 text-center mt-4">
<a class="font-description-sm text-description-sm text-primary hover:underline" href="#">الشروط والأحكام</a>
<span class="text-outline-variant">•</span>
<a class="font-description-sm text-description-sm text-primary hover:underline" href="#">سياسة الخصوصية</a>
</div>
</main>
<script>
        function switchTab(tab) {
            const bg = document.getElementById('segment-bg');
            const loginBtn = document.getElementById('btn-login');
            const signupBtn = document.getElementById('btn-signup');

            if (tab === 'login') {
                bg.style.transform = 'translateX(100%)';
                loginBtn.classList.replace('text-on-surface-variant', 'text-primary');
                signupBtn.classList.replace('text-primary', 'text-on-surface-variant');
            } else {
                bg.style.transform = 'translateX(0)';
                signupBtn.classList.replace('text-on-surface-variant', 'text-primary');
                loginBtn.classList.replace('text-primary', 'text-on-surface-variant');
            }
        }
    </script>
</body></html>
