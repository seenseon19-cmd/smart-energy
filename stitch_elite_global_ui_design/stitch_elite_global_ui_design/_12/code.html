<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SmartEnergy - Add Device</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#ecedf4",
                        "secondary": "#0051d5",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#00174b",
                        "on-tertiary-container": "#5be6ff",
                        "surface-container-low": "#f2f3fa",
                        "error-container": "#ffdad6",
                        "secondary-container": "#316bf3",
                        "on-secondary-fixed-variant": "#003ea8",
                        "on-primary-fixed": "#001c39",
                        "inverse-on-surface": "#eff0f7",
                        "inverse-primary": "#a3c9ff",
                        "surface-variant": "#e1e2e9",
                        "inverse-surface": "#2e3036",
                        "on-primary": "#ffffff",
                        "on-background": "#191c21",
                        "primary": "#00457f",
                        "tertiary": "#004b56",
                        "tertiary-fixed-dim": "#2fd9f4",
                        "surface": "#f8f9ff",
                        "on-primary-container": "#bcd6ff",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#004e5a",
                        "on-primary-fixed-variant": "#004883",
                        "on-secondary-container": "#fefcff",
                        "outline-variant": "#c1c7d3",
                        "on-error": "#ffffff",
                        "primary-container": "#005da7",
                        "secondary-fixed-dim": "#b4c5ff",
                        "on-tertiary-fixed": "#001f25",
                        "surface-container-highest": "#e1e2e9",
                        "on-surface": "#191c21",
                        "surface-tint": "#0860aa",
                        "on-surface-variant": "#414751",
                        "outline": "#727782",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#dbe1ff",
                        "surface-dim": "#d8dae0",
                        "primary-fixed": "#d3e3ff",
                        "surface-container-high": "#e7e8ef",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#a3c9ff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#006573",
                        "background": "#f8f9ff",
                        "tertiary-fixed": "#a2eeff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-sm": "8px",
                        "card-padding": "20px",
                        "unit": "4px",
                        "gutter-grid": "16px",
                        "stack-gap-lg": "32px",
                        "margin-page": "24px",
                        "stack-gap-md": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Cairo"],
                        "display-lg": ["Cairo"],
                        "headline-md": ["Cairo"],
                        "headline-lg": ["Cairo"],
                        "description-sm": ["Cairo"],
                        "headline-lg-mobile": ["Cairo"],
                        "body-md": ["Cairo"],
                        "label-md": ["Cairo"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["42px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "description-sm": ["13px", { "lineHeight": "18px", "fontWeight": "300" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased overflow-hidden w-full h-screen relative flex justify-center items-end md:items-center">
<!-- Fluid Background Gradient -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-inverse-primary/30 via-surface to-surface-container"></div>
<!-- BottomNavBar (Hidden here because it's a dialog/modal view) -->
<!-- Modal Content Canvas -->
<div class="relative z-50 w-full max-w-lg md:rounded-[32px] rounded-t-[32px] rounded-b-none glass-panel shadow-[0_10px_40px_rgba(0,37,127,0.1)] flex flex-col max-h-[795px] overflow-y-auto">
<!-- Header -->
<div class="sticky top-0 bg-surface-container-lowest/80 backdrop-blur-md px-margin-page py-6 flex items-center justify-between z-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Add Device</h2>
<button class="p-2 text-on-surface-variant hover:text-primary transition-colors duration-200 rounded-full hover:bg-surface-variant/30 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<div class="p-margin-page flex flex-col gap-stack-gap-lg">
<!-- Section: Basics -->
<div class="flex flex-col gap-stack-gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="deviceName">Device Name</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary-container focus:ring-1 focus:ring-secondary-container shadow-inner transition-all duration-200" id="deviceName" placeholder="e.g. Living Room Lamp" type="text"/>
</div>
</div>
<!-- Section: Category Selector -->
<div class="flex flex-col gap-stack-gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Category</label>
<div class="grid grid-cols-4 gap-gutter-grid">
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-xl border border-secondary-container bg-secondary-container/10 text-secondary-container transition-all duration-200">
<span class="material-symbols-outlined fill-icon" data-icon="lightbulb">lightbulb</span>
<span class="font-description-sm text-description-sm">Light</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-variant/20 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="mode_fan">mode_fan</span>
<span class="font-description-sm text-description-sm">Fan</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-variant/20 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="aod">aod</span>
<span class="font-description-sm text-description-sm">Display</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-variant/20 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="electrical_services">electrical_services</span>
<span class="font-description-sm text-description-sm">Outlet</span>
</button>
</div>
</div>
<!-- Section: Port Selector -->
<div class="flex flex-col gap-stack-gap-sm">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant">Relay Port Assignment</label>
<span class="font-description-sm text-description-sm text-outline">ESP32</span>
</div>
<div class="grid grid-cols-4 gap-unit">
<button class="p-3 rounded-lg border border-error bg-error/10 text-error flex items-center justify-center cursor-not-allowed opacity-70">
<span class="font-label-md text-label-md">1</span>
<span class="material-symbols-outlined text-[14px] ml-1" data-icon="lock">lock</span>
</button>
<button class="p-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:border-secondary-container hover:text-secondary-container transition-all duration-200">
<span class="font-label-md text-label-md">2</span>
</button>
<button class="p-3 rounded-lg border border-secondary-container bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-[0_4px_12px_rgba(49,107,243,0.3)]">
<span class="font-label-md text-label-md">3</span>
</button>
<button class="p-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:border-secondary-container hover:text-secondary-container transition-all duration-200">
<span class="font-label-md text-label-md">4</span>
</button>
<button class="p-3 rounded-lg border border-error bg-error/10 text-error flex items-center justify-center cursor-not-allowed opacity-70">
<span class="font-label-md text-label-md">5</span>
<span class="material-symbols-outlined text-[14px] ml-1" data-icon="lock">lock</span>
</button>
<button class="p-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:border-secondary-container hover:text-secondary-container transition-all duration-200">
<span class="font-label-md text-label-md">6</span>
</button>
<button class="p-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:border-secondary-container hover:text-secondary-container transition-all duration-200">
<span class="font-label-md text-label-md">7</span>
</button>
<button class="p-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface hover:border-secondary-container hover:text-secondary-container transition-all duration-200">
<span class="font-label-md text-label-md">8</span>
</button>
</div>
</div>
<!-- Section: Consumption -->
<div class="flex flex-col gap-stack-gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="consumption">Est. Consumption (Watts)</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl pl-4 pr-10 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary-container focus:ring-1 focus:ring-secondary-container shadow-inner transition-all duration-200" id="consumption" placeholder="0" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-outline font-body-md">W</span>
</div>
</div>
</div>
<!-- Sticky Footer Actions -->
<div class="sticky bottom-0 bg-surface-container-lowest/90 backdrop-blur-md px-margin-page py-4 border-t border-surface-variant flex gap-stack-gap-md z-10">
<button class="flex-1 py-3 px-6 rounded-full font-label-md text-label-md border border-outline-variant text-on-surface hover:bg-surface-variant/30 transition-colors duration-200">
                Cancel
            </button>
<button class="flex-1 py-3 px-6 rounded-full font-label-md text-label-md bg-primary text-on-primary shadow-[0_4px_15px_rgba(0,69,127,0.3)] hover:bg-primary/90 transition-all duration-200 active:scale-[0.98]">
                Add Device
            </button>
</div>
</div>
</body></html>
